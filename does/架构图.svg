<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" font-family="'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9"/>
      <stop offset="100%" style="stop-color:#c8e6c9"/>
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#bbdefb"/>
    </linearGradient>
    <linearGradient id="businessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0"/>
      <stop offset="100%" style="stop-color:#ffe0b2"/>
    </linearGradient>
    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5"/>
      <stop offset="100%" style="stop-color:#e1bee7"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="950" fill="#f0f2f5" rx="16"/>

  <!-- 标题区域 -->
  <rect x="50" y="20" width="900" height="60" rx="12" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="500" y="58" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="3">TRM 云原生智能研运平台 · 系统架构图</text>

  <!-- ==================== 前端层 ==================== -->
  <rect x="50" y="100" width="900" height="150" rx="14" fill="url(#frontendGrad)" stroke="#4CAF50" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="500" y="135" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">🖥️ 前端层 (Vue 3)</text>
  <line x1="70" y1="150" x2="930" y2="150" stroke="#a5d6a7" stroke-width="1.5"/>

  <!-- 第一行标签 -->
  <rect x="80" y="168" width="140" height="36" rx="18" fill="#ffffff" stroke="#4CAF50" stroke-width="2"/>
  <text x="150" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Vue 3 + TS</text>

  <rect x="235" y="168" width="120" height="36" rx="18" fill="#ffffff" stroke="#4CAF50" stroke-width="2"/>
  <text x="295" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Vite</text>

  <rect x="370" y="168" width="120" height="36" rx="18" fill="#ffffff" stroke="#4CAF50" stroke-width="2"/>
  <text x="430" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Pinia</text>

  <rect x="505" y="168" width="130" height="36" rx="18" fill="#ffffff" stroke="#4CAF50" stroke-width="2"/>
  <text x="570" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Vue Router</text>

  <rect x="650" y="168" width="110" height="36" rx="18" fill="#ffffff" stroke="#4CAF50" stroke-width="2"/>
  <text x="705" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Axios</text>

  <rect x="775" y="168" width="130" height="36" rx="18" fill="#ffffff" stroke="#4CAF50" stroke-width="2"/>
  <text x="840" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Element Plus</text>

  <!-- 第二行标签 -->
  <rect x="130" y="212" width="120" height="30" rx="15" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="190" y="233" text-anchor="middle" font-size="14" fill="#333">ECharts</text>

  <rect x="270" y="212" width="140" height="30" rx="15" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="340" y="233" text-anchor="middle" font-size="14" fill="#333">Monaco Editor</text>

  <rect x="430" y="212" width="130" height="30" rx="15" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="495" y="233" text-anchor="middle" font-size="14" fill="#333">WebSocket</text>

  <rect x="580" y="212" width="140" height="30" rx="15" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="650" y="233" text-anchor="middle" font-size="14" fill="#333">Tailwind CSS</text>

  <rect x="740" y="212" width="130" height="30" rx="15" fill="#ffffff" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="805" y="233" text-anchor="middle" font-size="14" fill="#333">Vue I18n</text>

  <!-- 箭头 -->
  <text x="500" y="270" text-anchor="middle" font-size="30" fill="#78909c">⬇</text>
  <text x="500" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#546e7a">HTTP/HTTPS + WebSocket</text>

  <!-- ==================== 网关层 ==================== -->
  <rect x="50" y="310" width="900" height="130" rx="14" fill="url(#gatewayGrad)" stroke="#2196F3" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="500" y="345" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565C0">🔀 网关层 (Gin)</text>
  <line x1="70" y1="360" x2="930" y2="360" stroke="#90caf9" stroke-width="1.5"/>

  <rect x="80" y="380" width="145" height="40" rx="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="153" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">JWT 认证</text>

  <rect x="245" y="380" width="145" height="40" rx="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="318" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">日志中间件</text>

  <rect x="410" y="380" width="120" height="40" rx="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="470" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">限流</text>

  <rect x="550" y="380" width="120" height="40" rx="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="610" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">熔断</text>

  <rect x="690" y="380" width="145" height="40" rx="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="763" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">路由转发</text>

  <!-- 箭头 -->
  <text x="500" y="455" text-anchor="middle" font-size="30" fill="#78909c">⬇</text>

  <!-- ==================== 业务服务层 ==================== -->
  <rect x="50" y="475" width="900" height="310" rx="14" fill="url(#businessGrad)" stroke="#FF9800" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="500" y="510" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">⚙️ 业务服务层</text>
  <line x1="70" y1="525" x2="930" y2="525" stroke="#ffcc80" stroke-width="1.5"/>

  <!-- 第一行 -->
  <rect x="80" y="545" width="255" height="70" rx="10" fill="#ffffff" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="575" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">📦 集群管理</text>
  <text x="208" y="600" text-anchor="middle" font-size="14" fill="#666">client-go · 健康巡检 · 版本升级</text>

  <rect x="360" y="545" width="255" height="70" rx="10" fill="#ffffff" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="488" y="575" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">📱 应用管理</text>
  <text x="488" y="600" text-anchor="middle" font-size="14" fill="#666">Deployment · Service · GitOps</text>

  <rect x="640" y="545" width="255" height="70" rx="10" fill="#ffffff" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="768" y="575" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">🔄 CICD</text>
  <text x="768" y="600" text-anchor="middle" font-size="14" fill="#666">GitLab CI · Argo CD</text>

  <!-- 第二行 -->
  <rect x="80" y="630" width="255" height="70" rx="10" fill="#ffffff" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="208" y="660" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">🖥️ 节点管理</text>
  <text x="208" y="685" text-anchor="middle" font-size="14" fill="#666">节点列表 · 节点池 · 节点维护</text>

  <rect x="360" y="630" width="255" height="70" rx="10" fill="#ffffff" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="488" y="660" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">🤖 AIOPS 智能运维</text>
  <text x="488" y="685" text-anchor="middle" font-size="14" fill="#666">可观测性 · 根因分析 · 自动治理</text>

  <rect x="640" y="630" width="255" height="70" rx="10" fill="#ffffff" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="768" y="660" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">🔔 告警中心</text>
  <text x="768" y="685" text-anchor="middle" font-size="14" fill="#666">告警规则 · 告警事件 · 通知渠道</text>

  <!-- 第三行 -->
  <rect x="220" y="715" width="255" height="60" rx="10" fill="#ffffff" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="348" y="743" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">💰 FinOps 成本治理</text>
  <text x="348" y="762" text-anchor="middle" font-size="14" fill="#666">成本总览 · 资源优化 · 预算告警</text>

  <rect x="500" y="715" width="255" height="60" rx="10" fill="#ffffff" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="628" y="743" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">⚙️ 系统设置</text>
  <text x="628" y="762" text-anchor="middle" font-size="14" fill="#666">权限管理 · 审计日志 · 平台集成</text>

  <!-- 箭头 -->
  <text x="500" y="805" text-anchor="middle" font-size="30" fill="#78909c">⬇</text>

  <!-- ==================== 基础设施层 ==================== -->
  <rect x="50" y="830" width="900" height="100" rx="14" fill="url(#infraGrad)" stroke="#9C27B0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="500" y="862" text-anchor="middle" font-size="22" font-weight="bold" fill="#6a1b9a">🏗️ 基础设施层</text>
  <line x1="70" y1="875" x2="930" y2="875" stroke="#ce93d8" stroke-width="1.5"/>

  <text x="500" y="910" text-anchor="middle" font-size="18" font-weight="bold" fill="#6a1b9a">
    ☸️ Kubernetes  ·  📊 Prometheus  ·  📈 Grafana  ·  📝 ETCD  ·  PostgreSQL  ·  Redis  ·  RabbitMQ  ·  MinIO
  </text>
</svg>